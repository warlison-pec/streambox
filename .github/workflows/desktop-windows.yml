# Instaladores .msi do StreamBox Desktop para Windows (o .msi só pode ser gerado no Windows).
# Rodar: aba Actions -> "StreamBox Desktop (Windows)" -> Run workflow. Também roda ao criar a tag desktop-v*.
name: StreamBox Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  msi:
    runs-on: windows-latest
    strategy:
      matrix:
        edicao: [pecbox, comunidade]
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A libmpv-2.dll (player) é baixada pelo próprio Gradle (tarefa baixarLibmpv, com o 7zr.exe oficial)
      - name: Gerar .msi
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --console=plain -Pedicao=${{ matrix.edicao }} packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: streambox-desktop-${{ matrix.edicao }}-windows
          path: desktop/build/${{ matrix.edicao }}/compose/binaries/main/msi/*.msi
